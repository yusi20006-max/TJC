name: TJC CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tjc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Shell syntax check
        run: |
          set -e
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 sh -n

      - name: ShellCheck
        run: |
          set -e
          shellcheck -S warning jules install.sh uninstall.sh lib/*.sh commands/*.sh workflow/*.sh scheduler/*.sh job/*.sh queue/*.sh mcp/*.sh policy/*.sh providers/*.sh plugin/*.sh test/*.sh

      - name: Test suite
        run: |
          set -e
          bash test/run_tests.sh

      - name: Required regression test presence
        run: |
          set -e
          test -f test/test_workflows.sh
          test -f test/test_scheduler.sh

      - name: Installer smoke test
        run: |
          set -e
          test -x ./install.sh
          test -x ./uninstall.sh
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT
          HOME="$tmp_home" ./install.sh
          command -v tjc >/dev/null 2>&1 || command -v jules >/dev/null 2>&1
